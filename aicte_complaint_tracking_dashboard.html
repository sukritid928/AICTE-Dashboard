    function App() {
      // Navigation state
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'complaints' | 'directory' | 'ai-radar' | 'escalations'

      // Main Data States
      const [complaints, setComplaints] = useState(INITIAL_COMPLAINTS);
      const [institutions] = useState(INITIAL_INSTITUTIONS);
      const [aiOverlaps, setAiOverlaps] = useState(INITIAL_AI_OVERLAPS);

      // Search & Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedBureauFilter, setSelectedBureauFilter] = useState('All');
      const [selectedStatusFilter, setSelectedStatusFilter] = useState('All');

      // Modals & Selection
      const [selectedInstitution, setSelectedInstitution] = useState(null);
      const [selectedComplaint, setSelectedComplaint] = useState(null);
      const [selectedOverlapPair, setSelectedOverlapPair] = useState(null);

      // Action Modal State
      const [actionModalOpen, setActionModalOpen] = useState(false);
      const [actionType, setActionType] = useState('status'); // 'status' | 'reassign' | 'hearing' | 'clarify'
      const [actionFormData, setActionFormData] = useState({
        status: '', bureau: '', officer: '', note: '', hearingDate: ''
      });

      // Notification Toast
      const [toastMsg, setToastMsg] = useState(null);
      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Realtime SLA Countdown Ticker
      useEffect(() => {
        const timer = setInterval(() => {
          setComplaints(prev => prev.map(c => {
            if (c.status === 'Resolved') return c;
            return { ...c, slaSecondsLeft: c.slaSecondsLeft - 1 };
          }));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Calculate SLA display string
      const formatSLA = (seconds) => {
        if (seconds < 0) {
          const overDays = Math.floor(Math.abs(seconds) / 86400);
          return { text: `OVERDUE (${overDays}d)`, isBreached: true };
        }
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        return { text: `${hrs}h ${mins}m ${secs}s`, isBreached: false };
      };

      // Computed Metrics
      const stats = useMemo(() => {
        const total = complaints.length;
        const pending = complaints.filter(c => c.status === 'New' || c.status === 'Assigned').length;
        const ongoing = complaints.filter(c => c.status === 'Under Investigation' || c.status === 'Pending Institution Response' || c.status === 'Hearing Scheduled').length;
        const resolved = complaints.filter(c => c.status === 'Resolved').length;
        const escalated = complaints.filter(c => c.isEscalated).length;
        const slaBreached = complaints.filter(c => c.slaSecondsLeft < 0 && c.status !== 'Resolved').length;
        const slaMetPercent = Math.round(((total - slaBreached) / (total || 1)) * 100);

        return { total, pending, ongoing, resolved, escalated, slaBreached, slaMetPercent };
      }, [complaints]);

      // Charts Data Prep
      const bureauChartData = useMemo(() => {
        const counts = {};
        complaints.forEach(c => {
          counts[c.bureau] = (counts[c.bureau] || 0) + 1;
        });
        return Object.keys(counts).map(k => ({ name: k, count: counts[k] }));
      }, [complaints]);

      const statusChartData = useMemo(() => {
        const counts = {};
        complaints.forEach(c => {
          counts[c.status] = (counts[c.status] || 0) + 1;
        });
        return Object.keys(counts).map(k => ({ name: k, value: counts[k] }));
      }, [complaints]);

      const STATUS_COLORS = ['#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#10b981', '#64748b'];

      // Filtered Complaints List
      const filteredComplaints = useMemo(() => {
        return complaints.filter(c => {
          const matchesSearch = 
            c.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.instName.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.instId.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.category.toLowerCase().includes(searchQuery.toLowerCase());

          const matchesBureau = selectedBureauFilter === 'All' || c.bureau === selectedBureauFilter;
          const matchesStatus = selectedStatusFilter === 'All' || c.status === selectedStatusFilter;

          return matchesSearch && matchesBureau && matchesStatus;
        });
      }, [complaints, searchQuery, selectedBureauFilter, selectedStatusFilter]);

      // Actions Handler
      const handleOpenActionModal = (complaint, type) => {
        setSelectedComplaint(complaint);
        setActionType(type);
        setActionFormData({
          status: complaint.status,
          bureau: complaint.bureau,
          officer: complaint.assignedOfficer,
          note: '',
          hearingDate: ''
        });
        setActionModalOpen(true);
      };

      const handleSaveAction = (e) => {
        e.preventDefault();
        if (!selectedComplaint) return;

        const todayStr = new Date().toISOString().split('T')[0];

        const updated = complaints.map(c => {
          if (c.id === selectedComplaint.id) {
            let updatedItem = { ...c };
            const newTimeline = [...(c.timeline || [])];
            const newHistory = [...(c.transferHistory || [])];

            if (actionType === 'status') {
              updatedItem.status = actionFormData.status;
              newTimeline.push({
                date: `${todayStr} (Just Now)`,
                title: `Status Updated to ${actionFormData.status}`,
                author: "Authorized Official",
                note: actionFormData.note || `Status modified to ${actionFormData.status}`
              });
            } else if (actionType === 'reassign') {
              newHistory.push({
                date: todayStr,
                from: c.bureau,
                to: actionFormData.bureau,
                officer: actionFormData.officer,
                remarks: actionFormData.note || "Bureau transfer processed."
              });
              updatedItem.bureau = actionFormData.bureau;
              updatedItem.assignedOfficer = actionFormData.officer;
              newTimeline.push({
                date: `${todayStr} (Just Now)`,
                title: `Reassigned to ${actionFormData.bureau}`,
                author: "Admin HQ",
                note: `Assigned to ${actionFormData.officer}. Reason: ${actionFormData.note}`
              });
            } else if (actionType === 'hearing') {
              updatedItem.status = 'Hearing Scheduled';
              updatedItem.nextAction = `Virtual Hearing on ${actionFormData.hearingDate}`;
              newTimeline.push({
                date: `${todayStr} (Just Now)`,
                title: `Official Hearing Scheduled`,
                author: c.assignedOfficer,
                note: `Hearing set for ${actionFormData.hearingDate}. Summons issued.`
              });
            } else if (actionType === 'clarify') {
              updatedItem.status = 'Pending Institution Response';
              newTimeline.push({
                date: `${todayStr} (Just Now)`,
                title: `Clarification Requested from College`,
                author: c.assignedOfficer,
                note: actionFormData.note || "Notice sent to Institute Director."
              });
            }

            updatedItem.timeline = newTimeline;
            updatedItem.transferHistory = newHistory;
            return updatedItem;
          }
          return c;
        });

        setComplaints(updated);
        setActionModalOpen(false);
        const refreshCurrent = updated.find(c => c.id === selectedComplaint.id);
        setSelectedComplaint(refreshCurrent);
        triggerToast(`Action recorded successfully for Case ${selectedComplaint.id}`);
      };

      const handleMergeCases = (overlapItem) => {
        const updated = complaints.map(c => {
          if (c.id === overlapItem.matchedCaseId) {
            return { 
              ...c, 
              status: 'Resolved', 
              nextAction: `Merged into Lead Case ${overlapItem.primaryCaseId}`,
              timeline: [
                ...c.timeline,
                {
                  date: new Date().toISOString().split('T')[0],
                  title: "Merged via AI Overlap Engine",
                  author: "AICTE Oversight Officer",
                  note: `Duplicate case merged under primary dossier ${overlapItem.primaryCaseId}.`
                }
              ]
            };
          }
          return c;
        });

        setComplaints(updated);
        setAiOverlaps(aiOverlaps.map(o => o.id === overlapItem.id ? { ...o, status: "Merged & Closed" } : o));
        setSelectedOverlapPair(null);
        triggerToast(`Case ${overlapItem.matchedCaseId} merged into ${overlapItem.primaryCaseId}`);
      };

      const handleDismissOverlap = (overlapId) => {
        setAiOverlaps(aiOverlaps.filter(o => o.id !== overlapId));
        setSelectedOverlapPair(null);
        triggerToast("AI Overlap Alert dismissed.");
      };

      const handleExportCSV = () => {
        const headers = ["Complaint ID", "AICTE Inst ID", "Institution Name", "Category", "Status", "Bureau", "Officer", "Priority", "Submission Date"];
        const rows = filteredComplaints.map(c => [
          c.id, c.instId, `"${c.instName}"`, `"${c.category}"`, c.status, c.bureau, `"${c.assignedOfficer}"`, c.priority, c.submissionDate
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `AICTE_Grievance_Report_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast("Grievance CSV Report downloaded.");
      };

      return (
        <div className="min-h-screen bg-aicteNavy-950 text-slate-100 flex flex-col md:flex-row">
          
          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed top-4 right-4 z-50 bg-aicteGold-500 text-slate-950 px-4 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-2 animate-bounce">

                                  <span className="font-mono">{t.date}</span>
                                </div>
                                <p className="text-slate-400 mt-0.5">{t.note}</p>
                              </div>
                            ))}
                          </div>
                        </div>

                      </div>
                    ) : (
                      <div className="bg-slate-950 border border-slate-800 rounded-2xl p-12 text-center text-slate-500 text-xs">
                        Select a complaint from the left list to inspect details and execute bureaucratic updates.
                      </div>
                    )}
                  </div>

                </div>

              </div>
            )}

            {/* TAB 3: INSTITUTION DIRECTORY */}
            {activeTab === 'directory' && (
              <div className="p-6 space-y-6">
                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6 text-center max-w-xl mx-auto space-y-3">
                  <h3 className="text-sm font-bold text-slate-100">National AICTE Approved Institutions Directory</h3>
                  <div className="relative">
                    <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input
                      type="text"
                      placeholder="Enter AICTE Permanent ID (e.g. 1-109982341) or Institute Name..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {institutions
                    .filter(inst => inst.name.toLowerCase().includes(searchQuery.toLowerCase()) || inst.id.toLowerCase().includes(searchQuery.toLowerCase()))
                    .map(inst => (
                      <div key={inst.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between">
                            <span className="font-mono text-[10px] font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">
                              ID: {inst.id}
                            </span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                              inst.riskScore === 'High' ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'
                            }`}>
                              Risk: {inst.riskScore}
                            </span>
                          </div>

                          <h4 className="text-sm font-bold text-slate-100 mt-3">{inst.name}</h4>
                          <p className="text-xs text-slate-400 mt-1">{inst.address}</p>

                          <div className="mt-4 space-y-1 text-xs text-slate-300 bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <div className="flex justify-between">
                              <span className="text-slate-500 font-mono">Category:</span>
                              <span>{inst.type}</span>
                            </div>
                            <div className="flex justify-between">
                              <span className="text-slate-500 font-mono">Approval:</span>
                              <span className="text-emerald-400 font-semibold">{inst.approvalStatus}</span>
                            </div>
                          </div>
                        </div>

                        <button
                          onClick={() => setSelectedInstitution(inst)}
                          className="mt-4 w-full py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs text-amber-400 font-bold border border-slate-800 transition"
                        >
                          View Institution Profile & Complaints
                        </button>
                      </div>
                    ))}
                </div>

                {/* MODAL */}
                {selectedInstitution && (
                  <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-slate-950 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 space-y-4">
                      <div className="flex justify-between border-b border-slate-800 pb-3">
                        <div>
                          <span className="font-mono text-xs text-amber-400 font-bold">PERMANENT ID: {selectedInstitution.id}</span>
                          <h3 className="text-base font-bold text-slate-100 mt-1">{selectedInstitution.name}</h3>
                        </div>
                        <button onClick={() => setSelectedInstitution(null)} className="text-slate-400 hover:text-slate-200">✕</button>
                      </div>

                      <div className="grid grid-cols-2 gap-3 text-xs bg-slate-900 p-3 rounded-xl">
                        <div><span className="text-slate-500 block font-mono">Region</span><span className="font-bold">{selectedInstitution.region}</span></div>
                        <div><span className="text-slate-500 block font-mono">Director</span><span className="font-bold">{selectedInstitution.director}</span></div>
                      </div>

                      <div>
                        <h4 className="text-xs font-bold text-slate-400 uppercase font-mono mb-2">Linked Complaints Dossiers</h4>
                        <div className="space-y-2">
                          {complaints.filter(c => c.instId === selectedInstitution.id).map(c => (
                            <div key={c.id} className="p-3 rounded-xl bg-slate-900 border border-slate-800 text-xs flex justify-between items-center">
                              <div>
                                <span className="font-mono font-bold text-amber-400">{c.id}</span>
                                <span className="text-slate-200 font-semibold ml-2">{c.category}</span>
                              </div>
                              <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">{c.status}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="flex justify-end pt-2">
                        <button onClick={() => setSelectedInstitution(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-xs text-slate-200 font-bold">Close</button>
                      </div>
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* TAB 4: AI OVERLAP RADAR */}
            {activeTab === 'ai-radar' && (
              <div className="p-6 space-y-6">
                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-2">
                  <div className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 text-xs font-bold border border-amber-500/20">
                    <i data-lucide="sparkles" className="w-3.5 h-3.5"></i> AI Overlap Engine Active
                  </div>
                  <h3 className="text-base font-bold text-slate-100">Cross-Reference Duplicate Detection Radar</h3>
                  <p className="text-xs text-slate-400">Scans complaint texts across different submitters and reference numbers to flag duplicate grievances.</p>
                </div>

                <div className="space-y-4">
                  {aiOverlaps.map(item => {
                    const primary = complaints.find(c => c.id === item.primaryCaseId);
                    const matched = complaints.find(c => c.id === item.matchedCaseId);

                    return (
                      <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-4">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                          <span className="font-mono text-xs font-bold text-amber-400">{item.id}</span>
                          <span className="text-xs font-mono font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/30">
                            {item.similarityScore}% TEXT SIMILARITY MATCH
                          </span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                          <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <span className="text-blue-400 font-mono font-bold block">LEAD DOSSIER: {primary?.id}</span>
                            <p className="font-bold text-slate-200 mt-1">{primary?.instName}</p>
                            <p className="text-slate-400 mt-1">{primary?.description}</p>
                          </div>
                          <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <span className="text-purple-400 font-mono font-bold block">FLAGGED MATCH: {matched?.id}</span>
                            <p className="font-bold text-slate-200 mt-1">{matched?.instName}</p>
                            <p className="text-slate-400 mt-1">{matched?.description}</p>
                          </div>
                        </div>

                        <div className="flex justify-between items-center pt-2">
                          <span className="text-xs text-amber-400 font-mono">Rec: {item.recommendation}</span>
                          <div className="flex gap-2">
                            <button onClick={() => setSelectedOverlapPair(item)} className="px-3 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold">Compare</button>
                            <button onClick={() => handleMergeCases(item)} className="px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 text-xs font-bold">Merge Cases</button>
                            <button onClick={() => handleDismissOverlap(item.id)} className="px-3 py-1.5 rounded-lg bg-slate-900 text-xs text-slate-400">Dismiss</button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* SIDE BY SIDE MODAL */}
                {selectedOverlapPair && (
                  <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-slate-950 border border-slate-800 rounded-2xl max-w-3xl w-full p-6 space-y-4">
                      <div className="flex justify-between border-b border-slate-800 pb-3">
                        <h3 className="text-sm font-bold text-slate-100">AI Side-by-Side Comparison</h3>
                        <button onClick={() => setSelectedOverlapPair(null)} className="text-slate-400">✕</button>
                      </div>

                      <div className="grid grid-cols-2 gap-4 text-xs">
                        <div className="bg-slate-900 p-3 rounded-xl">
                          <span className="font-mono text-amber-400 font-bold">{selectedOverlapPair.primaryCaseId}</span>
                          <p className="mt-2 text-slate-300">{complaints.find(c => c.id === selectedOverlapPair.primaryCaseId)?.description}</p>
                        </div>
                        <div className="bg-slate-900 p-3 rounded-xl">
                          <span className="font-mono text-purple-400 font-bold">{selectedOverlapPair.matchedCaseId}</span>
                          <p className="mt-2 text-slate-300">{complaints.find(c => c.id === selectedOverlapPair.matchedCaseId)?.description}</p>
                        </div>
                      </div>

                      <div className="flex justify-end gap-2 pt-2">
                        <button onClick={() => setSelectedOverlapPair(null)} className="px-4 py-2 rounded-xl bg-slate-900 text-xs font-bold">Close</button>
                        <button onClick={() => handleMergeCases(selectedOverlapPair)} className="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold">Approve Merge</button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 5: ESCALATIONS & OVERDUE */}
            {activeTab === 'escalations' && (
              <div className="p-6 space-y-6">
                <div className="bg-red-500/10 border border-red-500/30 rounded-2xl p-4 text-xs space-y-1">
                  <h3 className="font-bold text-red-400">Critical SLA Breaches</h3>
                  <p className="text-slate-300">Complaints that have passed their mandated turnaround window without resolution.</p>
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden text-xs">
                  <table className="w-full text-left">
                    <thead className="bg-slate-900 text-slate-400 font-mono uppercase">
                      <tr>
                        <th className="p-3">Ref ID</th>
                        <th className="p-3">Institution</th>
                        <th className="p-3">Bureau</th>
                        <th className="p-3">Officer</th>
                        <th className="p-3">SLA Status</th>
                        <th className="p-3 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {complaints.filter(c => c.slaSecondsLeft < 0 || c.isEscalated).map(c => (
                        <tr key={c.id}>
                          <td className="p-3 font-mono font-bold text-red-400">{c.id}</td>
                          <td className="p-3 font-medium text-slate-200">{c.instName}</td>
                          <td className="p-3">{c.bureau}</td>
                          <td className="p-3">{c.assignedOfficer}</td>
                          <td className="p-3">
                            <span className="bg-red-500/20 text-red-400 font-mono font-bold px-2 py-0.5 rounded">
                              {formatSLA(c.slaSecondsLeft).text}
                            </span>
                          </td>
                          <td className="p-3 text-right">
                            <button 
                              onClick={() => { setSelectedComplaint(c); setActiveTab('complaints'); }}
                              className="px-3 py-1 rounded bg-red-500 text-slate-950 text-xs font-bold"
                            >
                              Expedite
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* ACTION MODAL */}
          {actionModalOpen && selectedComplaint && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleSaveAction} className="bg-slate-950 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 text-xs">
                <div className="flex justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-slate-100">Update Case #{selectedComplaint.id}</h3>
                  <button type="button" onClick={() => setActionModalOpen(false)} className="text-slate-400">✕</button>
                </div>

                {actionType === 'status' && (
                  <div className="space-y-3">
                    <div>
                      <label className="block text-slate-400 mb-1 font-mono">Select New Status</label>
                      <select 
                        value={actionFormData.status}
                        onChange={(e) => setActionFormData({ ...actionFormData, status: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-slate-100"
                      >
                        <option value="New">New</option>
                        <option value="Assigned">Assigned</option>
                        <option value="Under Investigation">Under Investigation</option>
                        <option value="Pending Institution Response">Pending Inst. Response</option>
                        <option value="Hearing Scheduled">Hearing Scheduled</option>
                        <option value="Resolved">Resolved</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-mono">Audit Remarks</label>
                      <textarea
                        rows={3}
                        required
                        placeholder="Enter reason for status change..."
                        value={actionFormData.note}
                        onChange={(e) => setActionFormData({ ...actionFormData, note: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-slate-100"
                      />
                    </div>
                  </div>
                )}

                {actionType === 'reassign' && (
                  <div className="space-y-3">
                    <div>
                      <label className="block text-slate-400 mb-1 font-mono">Transfer Bureau</label>
                      <select 
                        value={actionFormData.bureau}
                        onChange={(e) => setActionFormData({ ...actionFormData, bureau: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-slate-100"
                      >
                        <option value="Grievance Redressal Cell">Grievance Redressal Cell</option>
                        <option value="Approval Bureau">Approval Bureau</option>
                        <option value="Vigilance Cell">Vigilance Cell</option>
                        <option value="Finance Bureau">Finance Bureau</option>
                        <option value="Academic Bureau">Academic Bureau</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-mono">Assigned Officer</label>
                      <input
                        type="text"
                        required
                        value={actionFormData.officer}
                        onChange={(e) => setActionFormData({ ...actionFormData, officer: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-slate-100"
                      />
                    </div>
                  </div>
                )}

                {actionType === 'hearing' && (
                  <div>
                    <label className="block text-slate-400 mb-1 font-mono">Hearing Date</label>
                    <input
                      type="date"
                      required
                      value={actionFormData.hearingDate}
                      onChange={(e) => setActionFormData({ ...actionFormData, hearingDate: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-slate-100"
                    />
                  </div>
                )}

                {actionType === 'clarify' && (
                  <div>
                    <label className="block text-slate-400 mb-1 font-mono">Query to Institution Principal</label>
                    <textarea
                      rows={3}
                      required
                      placeholder="Enter formal inquiry details..."
                      value={actionFormData.note}
                      onChange={(e) => setActionFormData({ ...actionFormData, note: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-slate-100"
                    />
                  </div>
                )}

                <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                  <button type="button" onClick={() => setActionModalOpen(false)} className="px-3 py-1.5 rounded-xl bg-slate-900 text-slate-400">Cancel</button>
                  <button type="submit" className="px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-bold">Save Changes</button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    // Initialize Lucide icons on render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    setTimeout(() => {
      if (window.lucide) window.lucide.createIcons();
    }, 500);
  </script>
</body>
</html>
